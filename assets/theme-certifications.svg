 <animate attributeName="stroke-dashoffset" values="0;-1200" dur="5s" repeatCount="indefinite"/>
</path>
<path d="M24 20H90M1110 20H1176" stroke="url(#neon)" stroke-width="2" opacity=".8"/>
<text x="600" y="53" text-anchor="middle" fill="#f2fbff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" letter-spacing="3.5" filter="url(#glow)">CERTIFICATIONS &amp; JOB SIMULATIONS<animate attributeName="opacity" values=".72;1;.72" dur="2.8s" repeatCount="indefinite"/><animate attributeName="fill" values="#d9faff;#ffffff;#c9c1ff;#d9faff" dur="4.5s" repeatCount="indefinite"/></text>
<text x="600" y="84" text-anchor="middle" fill="#a9dff0" font-family="Arial,Helvetica,sans-serif" font-size="8" font-weight="700" letter-spacing="4">CODLYTIC  •  DATA / CODE / INNOVATE</text>
