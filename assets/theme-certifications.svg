<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".52" stop-color="#09182a"/><stop offset="1" stop-color="#100e25"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22eaff"/><stop offset=".52" stop-color="#9274ff"/><stop offset="1" stop-color="#ffd27b"/></linearGradient>
