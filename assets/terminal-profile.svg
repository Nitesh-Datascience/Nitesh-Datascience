<title id="title">Nitesh Kumar — Analytics Terminal</title>
<desc id="desc">An animated cyan terminal dashboard with an ASCII portrait based on Nitesh's current GitHub avatar. Nitesh is a BCA graduate and Data Analyst in Delhi, India, working with Python, SQL, Excel, Power BI, and AI and machine learning.</desc>
