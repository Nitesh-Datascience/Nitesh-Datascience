<text x="48" y="70" fill="#00D9FF" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ABOUT MY APPROACH</text>
<text x="48" y="116" fill="#F4F7FF" font-family="Arial,sans-serif" font-size="31" font-weight="700">I transform raw data into meaningful decisions.</text>
<text x="48" y="151" fill="#B8C4DA" font-family="Arial,sans-serif" font-size="18">From data preparation and exploratory analysis to business intelligence, interactive dashboards,</text>
<text x="48" y="178" fill="#B8C4DA" font-family="Arial,sans-serif" font-size="18">and applied machine learning — I turn complex information into clear, practical insights.</text>
