<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Nitesh Kumar — CODLYTIC Cyber Analytics</title>
<desc id="desc">Original anime-inspired male cyber analyst in a dark burgundy environment with rose-pink and violet neon lighting, surrounded by data charts and analytics panels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10051b"/><stop offset=".52" stop-color="#1a0825"/><stop offset="1" stop-color="#26091f"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff39bd"/><stop offset="1" stop-color="#ff7ac8"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d946ef"/><stop offset="1" stop-color="#ff8bd1"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182944"/><stop offset="1" stop-color="#080d1b"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91b7e8" stroke-opacity=".11"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
