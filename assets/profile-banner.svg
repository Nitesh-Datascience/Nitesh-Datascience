    <text x="58" y="158" fill="#f7f7ff" font-size="66" font-weight="700" letter-spacing="-2">NITESH KUMAR</text>
    <text x="63" y="205" fill="url(#neon)" font-size="28" font-weight="700" letter-spacing="4">DATA ANALYST  ·  AI BUILDER</text>
    <text x="64" y="249" fill="#d3d8ed" font-size="20">Turning data into intelligence. Building what’s next.</text>
