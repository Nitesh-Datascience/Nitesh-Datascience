<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Nitesh Kumar — Futuristic Data Analytics</title>
<desc id="desc">Original anime-inspired cyber analyst artwork with red and electric-blue neon, data charts, SQL panels and analytics dashboards.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050812"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#180b18"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff3158"/><stop offset="1" stop-color="#ff7b54"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#168bff"/><stop offset="1" stop-color="#36e0ff"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8aa6d9" stroke-opacity=".12"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="22" fill="url(#bg)"/><rect width="1200" height="390" rx="22" fill="url(#grid)"/>
<path d="M0 8H1200" stroke="url(#blue)" stroke-width="5" filter="url(#glow)"/>
<path d="M0 340L500 245 720 290 1200 125" fill="none" stroke="url(#red)" stroke-width="2" opacity=".4"/>
