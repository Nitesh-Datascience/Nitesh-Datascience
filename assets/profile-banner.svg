 <linearGradient id="metal"><stop stop-color="#fff"/><stop offset=".45" stop-color="#8bdcff"/><stop offset="1" stop-color="#d6a85f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
