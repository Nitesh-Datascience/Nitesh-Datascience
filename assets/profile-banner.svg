 <text x="55" y="155" fill="#f4f7ff" font-size="62" font-weight="700" letter-spacing="-2">DATA ANALYST</text>
 <text x="59" y="199" fill="url(#blue)" font-size="25" font-weight="700" letter-spacing="3">TURNING DATA INTO INTELLIGENCE</text>
