<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Nitesh Kumar — CODLYTIC Data Analyst</title>
<desc id="desc">Modern data analytics profile banner with an anime-inspired male character based on Nitesh's uploaded portrait, featuring dark hair, moustache, forehead tilak and a futuristic hoodie.</desc>
<defs>
