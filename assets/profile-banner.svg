<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nitesh Kumar — CODLYTIC</title>
  <desc id="desc">A dark futuristic neon banner with cyan and magenta light trails, a digital grid and an analytics visualization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050713"/><stop offset=".55" stop-color="#10102a"/><stop offset="1" stop-color="#190b26"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3ebf"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8ba2d8" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 5H1200" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="1060" cy="90" r="210" fill="#8b5cf6" opacity=".09"/>
  <circle cx="1030" cy="300" r="180" fill="#ff3ebf" opacity=".06"/>
  <path d="M0 290C250 220 340 370 580 260S920 130 1200 190" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".28"/>
