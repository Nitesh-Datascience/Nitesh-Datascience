 .brand{font:700 13px Arial,sans-serif;letter-spacing:3px;fill:#9ca9ff}
 .num{font:700 12px Arial,sans-serif;fill:#dce9ff}
 .issuer{font:700 12px Arial,sans-serif;letter-spacing:1.8px;fill:#73eaff}
 .name{font:700 19px Arial,sans-serif;fill:#f5f7ff}
 .detail{font:13px Arial,sans-serif;fill:#c2cee2}
 .meta{font:700 10px Arial,sans-serif;letter-spacing:1.4px;fill:#91a6c8}
 .id{font:12px 'DejaVu Sans Mono',monospace;fill:#d8e6ff}
 </style>
</defs>
<rect width="1200" height="850" rx="26" fill="url(#bg)"/><rect width="1200" height="850" rx="26" fill="url(#grid)"/>
