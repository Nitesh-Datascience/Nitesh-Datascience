<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">CODLYTIC Certifications — Nitesh Kumar</title>
<desc id="desc">Nine colorful premium certificate cards on a deep navy technology background, showing issuer, date and credential ID.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071326"/><stop offset=".55" stop-color="#11152e"/><stop offset="1" stop-color="#211238"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123d56"/><stop offset="1" stop-color="#12233b"/></linearGradient>
