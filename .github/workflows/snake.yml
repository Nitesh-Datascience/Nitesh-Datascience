name: Generate Contribution Snake

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%231B1B1B&color_dots=%23FFF0D6%2C%23FFD08A%2C%23FFB347%2C%23FF8C00%2C%23D96B00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%231B1B1B&color_dots=%23FFF0D6%2C%23FFD08A%2C%23FFB347%2C%23FF8C00%2C%23D96B00
      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
